<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Loading…</title>
  </head>
  <body>
    <p>Loading…</p>
    <script>
      (async function loadAppAtRequestedPath() {
        try {
          const response = await fetch("/", { cache: "no-store" });
          if (!response.ok) throw new Error("Unable to load the site shell");

          let html = await response.text();
          html = html.replace("<head>", '<head><base href="/">');
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          window.location.replace("/");
        }
      })();
    </script>
    <noscript><p><a href="/">Go home</a></p></noscript>
  </body>
</html>
